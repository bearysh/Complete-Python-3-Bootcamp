name: Audio Magician

on:
  push:
    paths:
      - "AudioMagician/**"
      - ".github/workflows/audio-magician.yml"
  workflow_dispatch:

concurrency:
  group: audio-magician-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Test
        working-directory: AudioMagician/Packages/AudioMagicianKit
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

  app-build:
    name: App build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: AudioMagician
        run: xcodegen generate
      - name: Build
        working-directory: AudioMagician
        run: |
          set -o pipefail
          xcodebuild -project AudioMagician.xcodeproj -scheme AudioMagician \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
